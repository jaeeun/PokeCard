<?xml version="1.0" encoding="UTF-8"?>
<!--
  PokeCard app icon — ORIGINAL artwork.
  Motif: a camera / viewfinder framing a trading card with a sparkle.
  No trademarked or copyrighted assets are used. Pastel theme matching the app.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE3EC"/>
      <stop offset="0.55" stop-color="#FFC2D4"/>
      <stop offset="1" stop-color="#9FD9FF"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF2F6"/>
    </linearGradient>
    <linearGradient id="cardAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF738F"/>
      <stop offset="1" stop-color="#FFB36B"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#D14B6B" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Rounded background (iOS applies its own mask, but keep it tidy). -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Card inside the viewfinder, slightly tilted. -->
  <g transform="rotate(-8 512 540)" filter="url(#softShadow)">
    <rect x="372" y="330" width="280" height="392" rx="30" fill="url(#card)" stroke="#FFD2DE" stroke-width="4"/>
    <!-- Card "art window" (generic, abstract — not any real card). -->
    <rect x="402" y="364" width="220" height="150" rx="16" fill="url(#cardAccent)"/>
    <!-- Abstract rounded "creature" blob, fully original. -->
    <circle cx="512" cy="440" r="46" fill="#FFFFFF" opacity="0.92"/>
    <circle cx="494" cy="432" r="9" fill="#5A4A55"/>
    <circle cx="530" cy="432" r="9" fill="#5A4A55"/>
    <path d="M496 456 q16 14 32 0" stroke="#5A4A55" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Text lines (purely decorative). -->
    <rect x="402" y="536" width="220" height="16" rx="8" fill="#F2C6D2"/>
    <rect x="402" y="566" width="170" height="14" rx="7" fill="#E7D6DC"/>
    <rect x="402" y="592" width="200" height="14" rx="7" fill="#E7D6DC"/>
    <rect x="402" y="640" width="120" height="40" rx="12" fill="#9FD9FF"/>
  </g>

  <!-- Camera viewfinder corner brackets (the app's signature guiding lines). -->
  <g stroke="#FF4D6D" stroke-width="26" stroke-linecap="round" fill="none">
    <!-- top-left -->
    <path d="M250 360 v-70 a40 40 0 0 1 40 -40 h70"/>
    <!-- top-right -->
    <path d="M774 250 h70 a40 40 0 0 1 40 40 v70"/>
    <!-- bottom-left -->
    <path d="M250 664 v70 a40 40 0 0 0 40 40 h70"/>
    <!-- bottom-right -->
    <path d="M774 774 h70 a40 40 0 0 0 40 -40 v-70"/>
  </g>

  <!-- Shutter / lens hint at the bottom center. -->
  <circle cx="512" cy="792" r="30" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="512" cy="792" r="30" fill="none" stroke="#FF4D6D" stroke-width="10"/>

  <!-- Sparkle. -->
  <g fill="#FFE27A">
    <path d="M792 352 l16 44 44 16 -44 16 -16 44 -16 -44 -44 -16 44 -16 z"/>
  </g>
</svg>
