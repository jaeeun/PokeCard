# XcodeGen project spec for PokeCard.
# install.sh turns this into PokeCard.xcodeproj, then builds & installs it.
#
# Docs: https://github.com/yonaskolb/XcodeGen
#
# Bundle ID and development team are injected from the environment by
# install.sh (POKECARD_BUNDLE_ID / POKECARD_TEAM_ID), with sensible defaults.

name: PokeCard

options:
  bundleIdPrefix: ${POKECARD_BUNDLE_ID_PREFIX}
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Code signing is driven by install.sh via xcodebuild flags, but we set
    # automatic signing here so a plain Xcode open also works.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${POKECARD_TEAM_ID}

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"

targets:
  PokeCard:
    type: application
    platform: iOS
    sources:
      - path: PokeCard
        excludes:
          - "Resources/Info.plist"
          - "Resources/AppIcon.svg"   # design source, not a bundled resource
    info:
      path: PokeCard/Resources/Info.plist
      properties:
        # Camera permission — REQUIRED, or the app crashes when the scanner
        # tries to open the camera.
        NSCameraUsageDescription: "PokeCard uses the camera to scan your trading cards. Photos are processed on your device and are never uploaded."
        # Modern launch screen. An explicit (even if minimal) UILaunchScreen
        # dictionary is what tells iOS to render the app at the device's native
        # full resolution. Without it, iOS falls back to a scaled compatibility
        # mode and the content looks cropped / letterboxed on large screens
        # (e.g. iPhone 17 Pro).
        UILaunchScreen:
          UIColorName: ""
          UIImageRespectsSafeAreaInsets: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Google Sign-In callback URL scheme. Replace the placeholder with the
        # REVERSED_CLIENT_ID from your GoogleService-Info.plist (optional —
        # only needed for Google sign-in).
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - REPLACE_WITH_REVERSED_CLIENT_ID
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${POKECARD_BUNDLE_ID}
        TARGETED_DEVICE_FAMILY: "1"   # iPhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: GoogleSignIn
        product: GoogleSignIn
